name: Release

# Na main: com changesets pendentes, abre/atualiza o PR "Version Packages"; sem changesets e com versão
# nova no package.json (o PR de versão foi mergeado), publica no npm por trusted publishing (OIDC, sem
# token salvo), com provenance. Estrutura das sub-actions como no repositório do próprio Changesets.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {} # cada job declara só o que precisa

jobs:
  select-mode:
    name: Escolher modo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Escolher modo (version, publish ou none)
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: PR de versão
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit da versão
      pull-requests: write # abrir/atualizar o PR "Version Packages"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Abrir ou atualizar o PR "Version Packages"
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  pack:
    name: Empacotar
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Verificações antes de publicar
        run: npm run check
      - name: Empacotar (o prepack builda a lib)
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publicar no npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # O trusted publisher no npmjs.com é configurado com este workflow (release.yml) e este environment.
    environment: npm
    permissions:
      contents: write # tag e GitHub Release
      id-token: write # token OIDC do trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Publicar
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
